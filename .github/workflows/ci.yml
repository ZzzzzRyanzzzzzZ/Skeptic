name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Model is reproducible
        # Training is fully seeded, so retraining must reproduce the committed
        # model byte for byte. If this fails, something non-deterministic crept
        # into the pipeline and the published metrics no longer describe the
        # model that ships.
        run: |
          npm run train
          git diff --exit-code -- src/data/model.json
      - name: Build
        run: npm run build

  privacy-e2e:
    # Drives a real browser through the screenshot path and fails if any
    # request leaves the origin. The promise that nothing is uploaded is the
    # whole product, so it is verified against the built app, not just the
    # source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run test:e2e
